# GitHub Pages 自动部署脚本
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # 允许手动运行此工作流
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build Next.js (diagonal)
        run: npm run build
      - name: Build & merge vacuum-salt subproject
        # 构建真空制盐子项目（basePath=/vacuum-salt）并合并进 out/vacuum-salt，
        # 使线上 /vacuum-salt/ 不再 404
        run: node scripts/merge-vacuum.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Next.js 静态输出目录（含合并后的 vacuum-salt/）

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
