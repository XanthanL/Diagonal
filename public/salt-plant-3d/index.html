<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天车 3D 解构</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js",
      "three/addons/": "./js/vendor/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene-root"></div>

  <header id="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="16" y1="6.5" x2="3" y2="28"/>
        <line x1="16" y1="6.5" x2="29" y2="28"/>
        <line x1="8" y1="28" x2="16" y2="6.5"/>
        <line x1="24" y1="28" x2="16" y2="6.5"/>
        <line x1="11" y1="20.5" x2="21" y2="20.5"/>
        <line x1="12.6" y1="13.5" x2="19.4" y2="13.5"/>
        <line x1="11" y1="20.5" x2="19.4" y2="13.5"/>
        <line x1="21" y1="20.5" x2="12.6" y2="13.5"/>
        <circle cx="16" cy="6.5" r="2.4"/>
        <circle cx="16" cy="28" r="3.3"/>
      </svg></div>
      <div class="brand-text">
        <h1 id="tb-title">天车</h1>
        <p id="tb-sub">木构天车 3D 解构</p>
      </div>
    </div>
    <div id="legend" class="legend"></div>
  </header>

  <aside id="sidebar">
    <div id="side-title" class="side-title">天车装置</div>
    <div id="nav-list"></div>
    <div id="side-tip" class="side-tip">点击装置聚焦视角 · 拖拽旋转 · 滚轮缩放</div>
  </aside>

  <section id="infopanel">
    <div class="ip-head">
      <span id="ip-color" class="ip-color"></span>
      <div>
        <div id="ip-index" class="ip-index">装置</div>
        <h2 id="ip-name">装置名称</h2>
        <div id="ip-sub" class="ip-sub">Subtitle</div>
      </div>
    </div>
    <div class="ip-block">
      <h3 id="ip-title">工艺原理</h3>
      <p id="ip-principle"></p>
    </div>
    <div class="ip-block">
      <h3 id="ip-reaction-title">结构 · 营建要点</h3>
      <div id="ip-reaction" class="ip-reaction"></div>
    </div>
    <div class="ip-block">
      <h3 id="ip-equip-title">主要构件</h3>
      <ul id="ip-equip" class="ip-equip"></ul>
    </div>
    <div class="ip-block">
      <h3 id="ip-params-title">关键形制</h3>
      <div id="ip-params" class="ip-params"></div>
    </div>
    <div class="ip-block ip-out">
      <h3 id="ip-output-title">提卤产出</h3>
      <div id="ip-output" class="ip-output"></div>
    </div>
  </section>

  <div id="intro">
    <div class="intro-card">
      <div class="intro-mark"><svg viewBox="0 0 32 32" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="16" y1="6.5" x2="3" y2="28"/>
        <line x1="16" y1="6.5" x2="29" y2="28"/>
        <line x1="8" y1="28" x2="16" y2="6.5"/>
        <line x1="24" y1="28" x2="16" y2="6.5"/>
        <line x1="11" y1="20.5" x2="21" y2="20.5"/>
        <line x1="12.6" y1="13.5" x2="19.4" y2="13.5"/>
        <line x1="11" y1="20.5" x2="19.4" y2="13.5"/>
        <line x1="21" y1="20.5" x2="12.6" y2="13.5"/>
        <circle cx="16" cy="6.5" r="2.4"/>
        <circle cx="16" cy="28" r="3.3"/>
      </svg></div>
      <h2 id="intro-title">天车</h2>
      <p id="intro-desc"></p>
      <p id="intro-sub" class="intro-sub"></p>
      <button id="intro-enter">进入天车 ▸</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
