<script type="module">
import * as THREE from "three";
import { gsap } from "./vendor/gsap-index.js";

/* ══════════════════════════════════════════════════════════════
   1. 商品数据：4 种版型 × 12 件（参考 Molimao「ON THE RAIL」的
      混排节奏：短T / 长袖 / 兜帽卫衣 / 冲锋衣交替，低饱和色系）
══════════════════════════════════════════════════════════════*/
const ITEMS=[
  { cut:"tee",     base:"#F4F2ED", motif:"twoline",  name:"ARCHIVE TEE",       sub:"Two-Line Mark · 220gsm" },
  { cut:"hoodie",  base:"#4A5D4E", motif:"seal",     name:"SEAL HOODIE",       sub:"Roundel Badge · 400gsm" },
  { cut:"longtee", base:"#1A1A1A", motif:"stack",    name:"STACK LONGSLEEVE",  sub:"Vertical Type · 260gsm" },
  { cut:"shell",   base:"#2E3A4E", motif:"stripes",  name:"STRIPE SHELL",      sub:"Ripstop · Waterproof Zip" },
  { cut:"tee",     base:"#E3C8C0", motif:"wordmark", name:"DUST TEE",          sub:"Reverse Dyed · 220gsm" },
  { cut:"longtee", base:"#C9C4BA", motif:"strike",   name:"STRIKE LONGSLEEVE", sub:"Single Line · 260gsm" },
  { cut:"hoodie",  base:"#E8DCC8", motif:"twoline",  name:"CREAM HOODIE",      sub:"Brushed Fleece · 400gsm" },
  { cut:"shell",   base:"#B33A2A", motif:"wordmark", name:"DIAGONAL SHELL",    sub:"Ripstop · Waterproof Zip" },
];

/* ══════════════════════════════════════════════════════════════
   2. 织物法线贴图（程序化编织 -> Sobel -> RGB normal）
══════════════════════════════════════════════════════════════*/
function makeFabricNormal(size=256, period=7, strength=1.6){
  const h=new Float32Array(size*size);
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const u=x/size*Math.PI*2*period, v=y/size*Math.PI*2*period;
      const warp=Math.sin(u)*0.5, weft=Math.sin(v)*0.5;
      const twill=Math.sin(u+v)*0.35;
      h[y*size+x]=( (Math.sin(u)>0?warp:weft) + twill )*0.5+0.5;
    }
  }
  const cv=document.createElement("canvas"); cv.width=cv.height=size;
  const ctx=cv.getContext("2d");
  const img=ctx.createImageData(size,size);
  const at=(x,y)=>h[((y+size)%size)*size+((x+size)%size)];
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const dx=(at(x+1,y)-at(x-1,y))*strength;
      const dy=(at(x,y+1)-at(x,y-1))*strength;
      const len=Math.hypot(dx,dy,1);
      const i=(y*size+x)*4;
      img.data[i  ]=((-dx/len)*0.5+0.5)*255;
      img.data[i+1]=((-dy/len)*0.5+0.5)*255;
      img.data[i+2]=(( 1 /len)*0.5+0.5)*255;
      img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(12,12);
  return t;
}

/* ══════════════════════════════════════════════════════════════
   3. 印花贴图：按商品底色自适应墨色 + 版型专属细节
      （v=1 采样 canvas 顶部 = 领口，印花一律放胸口 H*0.24~0.60）
══════════════════════════════════════════════════════════════*/
function lumOf(hex){
  const n=parseInt(hex.slice(1),16);
  return (0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;
}
function makePrintTexture(item){
  const W=512,H=1024;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const dark=lumOf(item.base)<0.45;
  const ink=item.ink||(dark?"#F4F2ED":"#1A1A1A");
  const accent=dark?"#D4553F":"#B33A2A";

  x.fillStyle=item.base; x.fillRect(0,0,W,H);
  // 布纹颗粒（深浅底自适应）
  for(let i=0;i<9000;i++){
    x.fillStyle=dark?"rgba(250,250,248,"+(Math.random()*0.035)+")"
                    :"rgba(26,26,26,"+(Math.random()*0.03)+")";
    x.fillRect(Math.random()*W,Math.random()*H,1.6,1.6);
  }
  // 斜线母题底纹
  x.save(); x.strokeStyle=dark?"rgba(250,250,248,0.05)":"rgba(26,26,26,0.06)"; x.lineWidth=2;
  for(let i=-H;i<W;i+=26){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+H,H); x.stroke(); }
  x.restore();

  if(item.motif==="seal"){
    // 圆形徽章（Roundel）：外环 + 环上制式小字 + 中心对角线母题。
    // 此前 ITEMS 里声明了 motif:"seal" 但函数里没有对应分支 → 这件卫衣正面是白板。
    const R=Math.min(W,H)*0.155, cx=W/2, cy=H*0.40;
    x.save(); x.translate(cx,cy);
    x.strokeStyle=ink; x.lineWidth=5;
    x.beginPath(); x.arc(0,0,R,0,Math.PI*2); x.stroke();
    x.strokeStyle=ink; x.lineWidth=2;
    x.beginPath(); x.arc(0,0,R-14,0,Math.PI*2); x.stroke();
    // 中心对角斜线（呼应品牌母题）
    x.strokeStyle=accent; x.lineWidth=7;
    x.beginPath(); x.moveTo(-R*0.52,R*0.30); x.lineTo(R*0.52,-R*0.30); x.stroke();
    // 环上小字：上弧 "DIAGONAL"，下弧 "ARCHIVE"
    x.fillStyle=ink; x.textAlign="center"; x.textBaseline="middle";
    x.font="600 26px 'JetBrains Mono', monospace";
    const arc=(txt,r,a0,a1)=>{ for(let i=0;i<txt.length;i++){ const a=a0+(a1-a0)*(i/(txt.length-1)); x.save(); x.rotate(a); x.translate(0,-r); x.fillText(txt[i],0,0); x.restore(); } };
    arc("DIAGONAL",R-38,-Math.PI*0.72,Math.PI*0.72);
    x.rotate(Math.PI); arc("ARCHIVE",R-38,-Math.PI*0.6,Math.PI*0.6);
    x.restore(); x.textBaseline="alphabetic";
  } else if(item.motif==="twoline"){
    x.fillStyle=ink; x.textAlign="center"; x.font="700 92px Newsreader, serif";
    x.fillText("DIA",W/2,H*0.40); x.fillText("GONAL",W/2,H*0.52);
    x.strokeStyle=accent; x.lineWidth=4;
    x.beginPath(); x.moveTo(W*0.30,H*0.565); x.lineTo(W*0.70,H*0.565); x.stroke();
  } else if(item.motif==="strike"){
    x.fillStyle=ink; x.textAlign="center"; x.font="700 82px Newsreader, serif";
    x.fillText("DIAGONAL",W/2,H*0.48);
    x.strokeStyle=accent; x.lineWidth=5;
    x.beginPath(); x.moveTo(W*0.16,H*0.48-26); x.lineTo(W*0.84,H*0.48-26); x.stroke();
  } else if(item.motif==="offset"){
    x.fillStyle=ink; x.textAlign="center"; x.font="700 86px Newsreader, serif";
    x.fillText("DIAG",W/2-30,H*0.46); x.fillText("ONAL",W/2+54,H*0.55);
  } else if(item.motif==="stack"){
    x.fillStyle=ink; x.textAlign="center"; x.font="700 62px Newsreader, serif";
    ["D","I","A","G","O","N","A","L"].forEach((c,i)=>x.fillText(c,W/2,H*0.26+i*56));
  } else if(item.motif==="pocket"){
    x.fillStyle=ink; x.textAlign="left"; x.font="700 58px Newsreader, serif";
    x.fillText("DIA",72,392); x.fillText("GONAL",72,450);
    x.strokeStyle=ink; x.lineWidth=3.5; x.strokeRect(62,334,196,152);
  } else if(item.motif==="tile"){
    x.fillStyle=ink; x.textAlign="center"; x.font="700 84px Newsreader, serif";
    for(let gy=170; gy<H; gy+=196) for(let gx=70; gx<W; gx+=216){
      x.save(); x.translate(gx,gy); x.rotate(-0.18); x.fillText("DIA",0,0); x.restore();
    }
  } else if(item.motif==="wordmark"){
    x.fillStyle=ink; x.textAlign="center"; x.font="700 84px Newsreader, serif";
    x.fillText("DIAGONAL",W/2,H*0.44);
    x.fillStyle=accent; x.font="500 17px 'JetBrains Mono', monospace";
    x.fillText("— EST. ZIGONG —",W/2,H*0.485);
  } else if(item.motif==="stripes"){
    // 冲锋衣：胸前斜纹带
    x.save();
    x.translate(W/2,H*0.44); x.rotate(-0.30);
    for(let i=-3;i<=3;i++){
      x.fillStyle=i===0?accent:ink;
      x.fillRect(-W*0.7, i*30-9, W*1.4, 15);
    }
    x.restore();
    x.fillStyle=ink; x.textAlign="center"; x.font="700 74px Newsreader, serif";
    x.fillText("DIAGONAL",W/2,H*0.58);
  }
  // 下摆统一小字
  x.fillStyle=dark?"rgba(250,250,248,.38)":"rgba(26,26,26,.32)";
  x.font="500 16px 'JetBrains Mono', monospace"; x.textAlign="center";
  x.fillText("DIAGONAL ARCHIVE",W/2,H*0.90);

  // ── 版型专属细节 ──
  if(item.cut==="hoodie"){
    // 袋鼠兜：下半身居中口袋描线
    x.strokeStyle=dark?"rgba(250,250,248,.35)":"rgba(26,26,26,.32)";
    x.lineWidth=4;
    x.strokeRect(W*0.5-116,H*0.66,232,128);
    // 下摆罗纹
    x.strokeStyle=dark?"rgba(250,250,248,.22)":"rgba(26,26,26,.20)";
    x.lineWidth=3;
    for(let gx=8;gx<W;gx+=13){
      x.beginPath(); x.moveTo(gx,H*0.865); x.lineTo(gx,H*0.915); x.stroke();
    }
    // 抽绳孔
    x.fillStyle=dark?"rgba(250,250,248,.5)":"rgba(26,26,26,.45)";
    x.beginPath(); x.arc(W*0.5-52,H*0.145,7,0,Math.PI*2); x.fill();
    x.beginPath(); x.arc(W*0.5+52,H*0.145,7,0,Math.PI*2); x.fill();
  }
  if(item.cut==="shell"){
    // 前襟拉链
    x.strokeStyle=dark?"rgba(250,250,248,.55)":"rgba(26,26,26,.5)";
    x.lineWidth=6;
    x.beginPath(); x.moveTo(W/2,H*0.16); x.lineTo(W/2,H*0.96); x.stroke();
    x.lineWidth=2;
    for(let gy=H*0.17;gy<H*0.96;gy+=14){
      x.beginPath(); x.moveTo(W/2-7,gy); x.lineTo(W/2+7,gy); x.stroke();
    }
    x.fillStyle=ink; x.fillRect(W/2-9,H*0.44,18,34);     // 拉头
    // 立领示意线
    x.strokeStyle=dark?"rgba(250,250,248,.4)":"rgba(26,26,26,.4)";
    x.lineWidth=5;
    x.beginPath(); x.moveTo(W*0.24,H*0.135); x.quadraticCurveTo(W/2,H*0.10,W*0.76,H*0.135); x.stroke();
  }
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}

function makeBackTexture(item){
  const W=512,H=1024;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const x=cv.getContext("2d");
  const dark=lumOf(item.base)<0.45;
  x.fillStyle=item.base; x.fillRect(0,0,W,H);
  for(let i=0;i<9000;i++){
    x.fillStyle=dark?"rgba(250,250,248,"+(Math.random()*0.035)+")"
                    :"rgba(26,26,26,"+(Math.random()*0.03)+")";
    x.fillRect(Math.random()*W,Math.random()*H,1.6,1.6);
  }
  // 颈后领标
  x.fillStyle=dark?"rgba(250,250,248,.6)":"rgba(26,26,26,.55)"; x.textAlign="center";
  x.font="500 22px Newsreader, serif";
  x.fillText("D I A G O N A L",W/2,112);
  x.font="400 15px Newsreader, serif";
  x.fillText("100% COTTON · MADE IN ZIGONG",W/2,142);
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  return t;
}

// 素色小贴图（兜帽 / 立领用）：底色 + 颗粒
function makeSolidTexture(base){
  const S=128;
  const cv=document.createElement("canvas"); cv.width=cv.height=S;
  const x=cv.getContext("2d");
  x.fillStyle=base; x.fillRect(0,0,S,S);
  const dark=lumOf(base)<0.45;
  for(let i=0;i<600;i++){
    x.fillStyle=dark?"rgba(250,250,248,"+(Math.random()*0.05)+")"
                    :"rgba(26,26,26,"+(Math.random()*0.04)+")";
    x.fillRect(Math.random()*S,Math.random()*S,1.4,1.4);
  }
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

/* ══════════════════════════════════════════════════════════════
   4. 版型定义 + 服装拓扑
      前片 + 后片双层面料，边缘缝合；兜帽为第三块布片（pin 领后）
══════════════════════════════════════════════════════════════*/
const CUTS={
  // env = 布料的 envMapIntensity。旧值 0.15~0.50 太弱，环境光几乎不参与，
  // 才逼出了「贴图自发光兜底」这个瘆人补丁；环境提上来后自发光可以退场。
  //
  // 版型几何（2026-10-19 重写）。旧版型把袖子做成"顶行朝上翘的横翅膀"
  // （sleeveMax 在 y=0 处、往下收到 sleeveMin），整件呈十字兽皮形 —— 这是
  // 「像口袋不像衣服」的头号原因。现在袖子是一条从肩点向外下方延伸的锥形胶囊：
  //   shX/shY   = 肩点（袖窿），袖子从这里长出去
  //   cuffX/cuffY = 袖口中心；短袖停在胸侧，长袖一路垂到接近下摆
  //   sleeveR0/R1 = 袖管半径（肩部粗 → 袖口收）
  // 躯干另有收腰（bodyW），胸背间距靠 thick 撑出真正的筒状体积。
  tee:    {SY:2.50, shX:0.50, shY:0.20, cuffX:0.93, cuffY:1.00, sleeveR0:0.190, sleeveR1:0.125,
           body:0.60, thick:0.42, collarR:0.30,
           rough:0.94, env:0.68, stiff:1.00, windK:1.00, heavy:1.00},
  longtee:{SY:2.62, shX:0.50, shY:0.20, cuffX:0.97, cuffY:1.98, sleeveR0:0.185, sleeveR1:0.105,
           body:0.60, thick:0.42, collarR:0.30,
           rough:0.94, env:0.68, stiff:1.00, windK:0.90, heavy:1.05},
  hoodie: {SY:2.72, shX:0.54, shY:0.22, cuffX:1.00, cuffY:2.02, sleeveR0:0.215, sleeveR1:0.125,
           body:0.66, thick:0.50, collarR:0.36,
           rough:1.00, env:0.60, stiff:1.05, windK:0.70, heavy:1.15, hood:true},
  shell:  {SY:2.80, shX:0.54, shY:0.22, cuffX:0.99, cuffY:2.08, sleeveR0:0.205, sleeveR1:0.115,
           body:0.64, thick:0.44, collarR:0.22,
           rough:0.60, env:0.85, stiff:1.12, windK:0.55, heavy:1.10, collar:true},
};

function buildGarment(cut){
  const SX=1.25;
  const SY=cut.SY;
  const SLOPE=0.62;
  const THICK=cut.thick;
  // step 0.135 → 0.105：20×20 的网格在屏幕上读出方格棱角（瘆人感的几何来源之一）。
  // 粒子与弹簧约 ×1.6，Verlet 4 iter 每帧 ~3 万次弹簧求解，仍远低于预算。
  const step=0.105;
  const cols=Math.round(2*SX/step)+1;
  const rows=Math.round(SY/step)+1;
  const pid=(c,r)=>r*cols+c;

  // 躯干半宽：肩 → 腰微收 → 下摆放开（不做收腰就是一根直筒，也是"口袋"观感的一部分）
  const bodyW=(y)=>cut.body*(1-0.10*Math.sin(Math.max(0,Math.min(1,y/SY))*Math.PI));
  // 袖：肩点 → 袖口的锥形胶囊（在 +x 侧求值，靠 |x| 镜像）
  const SHX=cut.shX, SHY=cut.shY;
  const VX=cut.cuffX-SHX, VY=cut.cuffY-SHY, VV=VX*VX+VY*VY;
  function inSleeve(ax,y){
    const t=Math.max(0,Math.min(1,((ax-SHX)*VX+(y-SHY)*VY)/VV));
    const dx=ax-(SHX+VX*t), dy=y-(SHY+VY*t);
    const rr=cut.sleeveR0+(cut.sleeveR1-cut.sleeveR0)*t;
    return dx*dx+dy*dy<=rr*rr;
  }
  function inside(x,y){
    if(y<0||y>SY) return false;
    const ax=Math.abs(x);
    if(ax>bodyW(y)&&!inSleeve(ax,y)) return false;
    if(x*x+y*y<cut.collarR*cut.collarR&&y<cut.collarR+0.06) return false;   // 领口挖空
    return true;
  }

  // --- 逐层登记活跃格点 ---
  const active=new Int32Array(cols*rows).fill(-1);
  const at=(c,r)=>(c<0||c>=cols||r<0||r>=rows)?-1:active[pid(c,r)];
  let n=0;
  const gx=[],gy=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const X=-SX+c*step, Y=r*step;
    if(!inside(X,Y)) continue;
    active[pid(c,r)]=n; gx.push(X); gy.push(Y); n++;
  }

  // --- 到边缘的距离场（决定截面剖面：边缘成缝 → 中央鼓起成体） ---
  const dist=new Int16Array(n).fill(-1);
  {
    const queue=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const i=at(c,r); if(i<0) continue;
      if(at(c-1,r)<0||at(c+1,r)<0||at(c,r-1)<0||at(c,r+1)<0){ dist[i]=0; queue.push(i); }
    }
    for(let h=0;h<queue.length;h++){
      const i=queue[h];
      const cc=Math.round((gx[i]+SX)/step), rr=Math.round(gy[i]/step);
      for(const j of [at(cc+1,rr),at(cc-1,rr),at(cc,rr+1),at(cc,rr-1)]){
        if(j<0||dist[j]>=0) continue;
        dist[j]=dist[i]+1; queue.push(j);
      }
    }
  }
  // 截面厚度：边缘并成缝 → 中央鼓成筒。
  // 旧 profile(d)=min(1,d/3) 只在最外 3 格（≈0.32）收边，中段厚度恒定 ——
  // 前后两片被撑成一块平贴的鼓包，从任何角度看都是"口袋 / 充气垫"。
  // 改成 0.50 世界单位的椭圆过渡：胸背之间才真的有筒状体积，也有侧面可承接轮廓光。
  const TAPER=0.50;
  const profile=(d)=>{
    const u=Math.max(0,Math.min(1,d*step/TAPER));
    return Math.sqrt(u*(2-u));            // 椭圆剖面：边缘收成缝、中央饱满
  };
  // 竖向褶皱：整块布沿 x 做正弦起伏（前后片同相 = 整件一起波动，不是各自鼓包）。
  // 关键：波形直接写进初始坐标，弹簧静长因此等于波形的弦长 —— 褶皱是"静止形态"，
  // 不会被求解器拉平，也不会因为弹簧想收缩而抽搐。肩部最密（挂在衣架上必然在肩线聚拢）、
  // 向下渐隐，让下摆自然散开。
  const PLEAT_K=15.0, PLEAT_A=0.055;
  const pleat=(x,y)=>{
    const t=Math.max(0,Math.min(1,y/SY));
    return PLEAT_A*(1-0.45*t)*Math.sin(x*PLEAT_K+y*1.2);
  };

  // --- 闭合壳体：前后两层在轮廓边界共享同一组粒子（真缝合），内部保持双层厚度 ---
  const px=[],py=[],pz=[],pinned=[],uv=[];
  const mapA=new Int32Array(n), mapB=new Int32Array(n);
  for(let layer=0;layer<2;layer++){
    for(let i=0;i<n;i++){
      if(layer===1 && dist[i]===0){ mapB[i]=mapA[i]; continue; }   // 边界：直接复用前层粒子 → 闭合无缝
      const idx=px.length;
      px.push(gx[i]);
      const blend=Math.max(0,1-gy[i]/1.2);
      py.push(-(gy[i]+SLOPE*Math.abs(gx[i])*blend));
      const half=THICK*0.5*profile(dist[i]);          // 边缘并成缝、中央鼓成筒
      const pl=pleat(gx[i],gy[i]);                    // 竖向褶皱（前后片同相）
      pz.push(layer===0? half+pl : -half+pl);
      pinned.push(gy[i]<0.26 && Math.abs(gx[i])<=0.68);
      const c=Math.round((gx[i]+SX)/step), r=Math.round(gy[i]/step);
      uv.push(layer===0? c/(cols-1) : 1-c/(cols-1), 1-r/(rows-1));
      if(layer===0) mapA[i]=idx; else mapB[i]=idx;
    }
  }

  // --- 弹簧 ---
  const springs=[];
  const addS=(a,b,stiff,restOverride)=>{
    if(a==null||b==null||a<0||b<0) return;
    const dx=px[a]-px[b], dy=py[a]-py[b], dz=pz[a]-pz[b];
    const rest=restOverride!=null?restOverride:Math.hypot(dx,dy,dz);
    springs.push({a,b,rest,stiff});
  };
  const perLayer=(mp)=>(c,r)=>{ const i=at(c,r); return i<0?-1:mp[i]; };

  for(const mp of [mapA,mapB]){
    const P=perLayer(mp);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const i=P(c,r); if(i<0) continue;
      addS(i,P(c+1,r),1.0*cut.stiff);
      addS(i,P(c,r+1),1.0*cut.stiff);
      addS(i,P(c+1,r+1),1.0*cut.stiff);    // 剪切拉满：防袖口/下摆锯齿
      addS(i,P(c+1,r-1),1.0*cut.stiff);
      addS(i,P(c+2,r),0.92*cut.stiff);
      addS(i,P(c,r+2),0.92*cut.stiff);
    }
  }

  // --- 层间联结：法向撑厚 + 斜向抗剪（让前后真正成为一个布筒，而不是两片各飘各的布） ---
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const i=at(c,r); if(i<0||dist[i]===0) continue;   // 边界粒子已两层共用，无需联结
    addS(mapA[i],mapB[i],0.55);                       // 法向：撑住厚度
    for(const off of [[1,0],[0,1]]){
      const j=at(c+off[0],r+off[1]);
      if(j<0||dist[j]===0) continue;
      addS(mapA[i],mapB[j],0.20);                     // 斜向：抗前后错切
      addS(mapA[j],mapB[i],0.20);
    }
  }

  // --- 三角面（前片 + 后片） ---
  const frontIdx=[], backIdx=[];
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
    const a=at(c,r), b=at(c+1,r), d=at(c,r+1), e=at(c+1,r+1);
    if(a>=0&&b>=0&&d>=0&&e>=0){
      if(a===e||b===d) continue;   // 闭合壳斜边：对角点已合并为同一粒子 → 零面积退化面，跳过
      frontIdx.push(mapA[a],mapA[b],mapA[d], mapA[b],mapA[e],mapA[d]);
      backIdx.push(mapB[a],mapB[b],mapB[d], mapB[b],mapB[e],mapB[d]);
    }
  }

  // --- 兜帽：第三块布片，pin 顶行在领口内（正面透过领口可见），垂在背后 ---
  let hoodN=0;
  const hoodIdx=[];
  if(cut.hood){
    const HCOLS=9, HROWS=6, HW=0.64, HH=0.72;
    const hoodBase=px.length;   // px 每粒子 1 项，粒子数=px.length（原 /3 是 bug：兜帽索引一直错位）
    const hz=-(THICK*0.5+0.10);
    for(let r=0;r<HROWS;r++){
      for(let c=0;c<HCOLS;c++){
        px.push(-HW/2+c*(HW/(HCOLS-1)));
        py.push(0.24-r*(HH/(HROWS-1)));
        pz.push(hz-Math.sin(c/(HCOLS-1)*Math.PI)*0.06);   // 顶行微向后弯，像翻在领后
        pinned.push(r===0);
        uv.push(c/(HCOLS-1), 1-r/(HROWS-1));
        hoodN++;
      }
    }
    const HP=(c,r)=>hoodBase+r*HCOLS+c;
    const HPg=(c,r)=>(c<0||c>=HCOLS||r<0||r>=HROWS)?-1:HP(c,r);   // 兜帽弹簧必须走此卫：无边界检查会越界/错位引用主网格 → NaN
    for(let r=0;r<HROWS;r++) for(let c=0;c<HCOLS;c++){
      addS(HPg(c,r),HPg(c+1,r),0.9);
      addS(HPg(c,r),HPg(c,r+1),0.9);
      addS(HPg(c,r),HPg(c+1,r+1),0.75);
      addS(HPg(c,r),HPg(c+1,r-1),0.75);
      addS(HPg(c,r),HPg(c+2,r),0.45);       // 兜帽要软，弯曲弱一点才有堆叠感
      addS(HPg(c,r),HPg(c,r+2),0.45);
    }
    for(let r=0;r<HROWS-1;r++) for(let c=0;c<HCOLS-1;c++){
      hoodIdx.push(HP(c,r),HP(c+1,r),HP(c,r+1), HP(c+1,r),HP(c+1,r+1),HP(c,r+1));
    }
  }

  return { px,py,pz,pinned,uv,springs,frontIdx,backIdx,hoodIdx,
           count:px.length };   // 兜帽粒子已 push 进 px，无需再加 hoodN（多算会越界读 undefined → NaN）
}

/* ══════════════════════════════════════════════════════════════
   5. 衣架 + 滑轮小车 + Garment 类
══════════════════════════════════════════════════════════════*/
const WOOD=new THREE.MeshStandardMaterial({color:0x8B5A33,roughness:0.62,metalness:0.04});
const STEEL=new THREE.MeshStandardMaterial({color:0xC9CBCC,roughness:0.26,metalness:0.95});
const DARKSTEEL=new THREE.MeshStandardMaterial({color:0x3A3A3D,roughness:0.42,metalness:0.8});

class Garment{
  constructor(scene,item,index,fabricNormal){
    this.item=item; this.index=index;
    this.cut=CUTS[item.cut];
    this.group=new THREE.Group();
    scene.add(this.group);

    const d=buildGarment(this.cut);
    this.px=d.px.slice(); this.py=d.py.slice(); this.pz=d.pz.slice();
    this.ppx=d.px.slice(); this.ppy=d.py.slice(); this.ppz=d.pz.slice();
    this.pinned=d.pinned.slice(); this.springs=d.springs; this.count=d.count;

    const geo=new THREE.BufferGeometry();
    this.posAttr=new THREE.Float32BufferAttribute(new Float32Array(this.count*3),3);
    geo.setAttribute("position",this.posAttr);
    geo.setAttribute("uv",new THREE.Float32BufferAttribute(new Float32Array(d.uv),2));
    const indices=d.frontIdx.concat(d.backIdx,d.hoodIdx);
    geo.setIndex(indices);
    geo.addGroup(0,d.frontIdx.length,0);
    geo.addGroup(d.frontIdx.length,d.backIdx.length,1);
    if(d.hoodIdx.length) geo.addGroup(d.frontIdx.length+d.backIdx.length,d.hoodIdx.length,2);

    // 旧版「贴图自发光兜底」（emissiveMap=map, intensity 0.5）已撤：
    // 每个像素无条件加 50% 自发光 → 全场景无暗部、无体积，读成惨白塑料片 ——
    // 这正是「瘆人」的主源。现在靠 environment（全方向 IBL）+ 加强 key 光提供
    // 各朝向的显色与褶皱明暗；保留 0.10 只是防深色布料在暗侧死黑。
    const fm=makePrintTexture(item), bm=makeBackTexture(item);
    const fabric={side:THREE.DoubleSide,roughness:this.cut.rough,metalness:0.0,
                  normalMap:fabricNormal,envMapIntensity:this.cut.env,
                  emissive:0xffffff,emissiveIntensity:0.10};
    this.frontMat=new THREE.MeshStandardMaterial({
      ...fabric, map:fm, normalScale:new THREE.Vector2(0.5,0.5)});
    this.backMat=new THREE.MeshStandardMaterial({
      ...fabric, map:bm, normalScale:new THREE.Vector2(0.5,0.5)});
    this.mats=[this.frontMat,this.backMat];
    const materials=[this.frontMat,this.backMat];
    if(d.hoodIdx.length){
      const solid=makeSolidTexture(item.base);
      this.hoodMat=new THREE.MeshStandardMaterial({
        side:THREE.DoubleSide,roughness:Math.min(1,this.cut.rough+0.04),metalness:0.0,
        normalMap:fabricNormal,envMapIntensity:this.cut.env*0.8,
        emissive:0xffffff,emissiveIntensity:0.10,
        map:solid,
        normalScale:new THREE.Vector2(0.5,0.5)});
      this.mats.push(this.hoodMat);
      materials.push(this.hoodMat);
    }
    this.mesh=new THREE.Mesh(geo,materials);
    this.mesh.position.z=-0.02;
    this.mesh.castShadow=true;
    // 互相接影：相邻衣服的影子落在彼此身上，是布料体积感最便宜的来源
    this.mesh.receiveShadow=true;
    this.group.add(this.mesh);

    this.buildHanger();
    this.buildRunner();
    if(this.cut.collar) this.buildCollar();

    this.baseScale=0.60;
    this.group.scale.setScalar(this.baseScale);
    this.baseRot=-0.62+(index%2?0.10:0);
    this.group.rotation.y=this.baseRot;
    this.iter=4;

    this.syncGeometry();
  }

  buildHanger(){
    const localTo=(mesh,from,to,radius,mat)=>{
      const dir=new THREE.Vector3().subVectors(to,from);
      const len=dir.length();
      const m=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,len,12),mat);
      m.position.copy(from).add(to).multiplyScalar(0.5);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
      m.castShadow=true;
      this.group.add(m); return m;
    };
    const APEX=new THREE.Vector3(0,0.02,0);
    for(const s of [-1,1]){
      localTo(null,APEX,new THREE.Vector3(s*0.66,-0.41,0),0.030,WOOD);
    }
    localTo(null,new THREE.Vector3(-0.66,-0.41,0),new THREE.Vector3(0.66,-0.41,0),0.026,WOOD);
    const apexBall=new THREE.Mesh(new THREE.SphereGeometry(0.042,14,10),WOOD);
    apexBall.position.copy(APEX); this.group.add(apexBall);
    localTo(null,APEX,new THREE.Vector3(0,0.66,0),0.024,STEEL);
    const eye=new THREE.Mesh(new THREE.TorusGeometry(0.055,0.021,10,18),STEEL);
    eye.position.set(0,0.66,0); eye.rotation.y=Math.PI/2; this.group.add(eye);
  }

  buildRunner(){
    const WY=1.20;
    this.runnerY=WY;
    this.wheels=[];
    const yoke=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.055,0.13),DARKSTEEL);
    yoke.position.set(0,WY,0); yoke.castShadow=true; this.group.add(yoke);
    for(const s of [-1,1]){
      const w=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.062,20),STEEL);
      w.rotation.x=Math.PI/2;
      w.position.set(s*0.155,WY,0);
      w.material=new THREE.MeshStandardMaterial({color:0xB9BBBC,roughness:0.3,metalness:0.9});
      w.castShadow=true;
      this.group.add(w); this.wheels.push(w);
      const ax=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.10,8),DARKSTEEL);
      ax.rotation.x=Math.PI/2; ax.position.copy(w.position); this.group.add(ax);
    }
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.62,10),STEEL);
    stem.position.set(0,0.87,0); stem.castShadow=true; this.group.add(stem);
  }

  // 冲锋衣立领：贴在领口上的硬质扁环
  buildCollar(){
    const baseCol=new THREE.Color(this.item.base).multiplyScalar(0.82);
    const collarMat=new THREE.MeshStandardMaterial({
      color:baseCol,roughness:0.55,metalness:0.02,
      // 与布料同一策略：env 主导显色，只留 0.08 防死黑
      emissive:baseCol,emissiveIntensity:0.08});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.23,0.058,12,26),collarMat);
    ring.rotation.x=Math.PI/2;
    ring.scale.set(1,1,0.55);
    ring.position.set(0,0.045,0);
    ring.castShadow=true;
    this.group.add(ring);
  }

  spinWheels(dx){ const a=-dx/0.085; for(const w of this.wheels) w.rotation.y=a; }

  /* 布料拨动：鼠标扫过布面时，对命中点附近粒子施加冲量（Verlet 上一帧位置偏移法） */
  poke(lx,ly,lz,fx,fy){
    const R=0.55, K=0.10;                    // 影响半径（局部单位）与冲量强度
    for(let i=0;i<this.count;i++){
      if(this.pinned[i]) continue;
      const dx=this.px[i]-lx, dy=this.py[i]-ly, dz=this.pz[i]-lz;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2>R*R) continue;
      const fall=(1-Math.sqrt(d2)/R);        // 线性衰减
      this.ppx[i]-=fx*K*fall;
      this.ppy[i]-=fy*K*fall;
      this.ppz[i]-=0.012*fall;               // 轻微向外顶，产生"拨衣"体积感
    }
  }

  step(dt,wind,t,iter){
    const g=9.8,damp=0.972,dt2=dt*dt;
    const wk=this.cut.windK, heavy=this.cut.heavy;
    for(let i=0;i<this.count;i++){
      if(this.pinned[i]) continue;
      let vx=(this.px[i]-this.ppx[i])*damp;
      let vy=(this.py[i]-this.ppy[i])*damp;
      let vz=(this.pz[i]-this.ppz[i])*damp;
      const vmax=0.045;
      vx=Math.max(-vmax,Math.min(vmax,vx));
      vy=Math.max(-vmax,Math.min(vmax,vy));
      vz=Math.max(-vmax,Math.min(vmax,vz));
      this.ppx[i]=this.px[i]; this.ppy[i]=this.py[i]; this.ppz[i]=this.pz[i];
      const w=wind*wk*(0.6+0.4*Math.sin(t*1.6+i*0.27));
      this.px[i]+=vx;
      this.py[i]+=vy-g*dt2*4.2*heavy;
      this.pz[i]+=vz+w*dt2*3.2;
    }
    for(let it=0;it<iter;it++){
      for(let k=0;k<this.springs.length;k++){
        const s=this.springs[k],a=s.a,b=s.b;
        let dx=this.px[b]-this.px[a],dy=this.py[b]-this.py[a],dz=this.pz[b]-this.pz[a];
        const d=Math.hypot(dx,dy,dz)||1e-5;
        const f=(d-s.rest)/d*0.5*s.stiff;
        dx*=f; dy*=f; dz*=f;
        if(!this.pinned[a]){ this.px[a]+=dx; this.py[a]+=dy; this.pz[a]+=dz; }
        if(!this.pinned[b]){ this.px[b]-=dx; this.py[b]-=dy; this.pz[b]-=dz; }
      }
    }
  }

  syncGeometry(){
    const arr=this.posAttr.array;
    for(let i=0;i<this.count;i++){
      arr[i*3]=this.px[i]; arr[i*3+1]=this.py[i]; arr[i*3+2]=this.pz[i];
    }
    this.posAttr.needsUpdate=true;
    const geo=this.mesh.geometry;
    geo.computeVertexNormals();
    // 闭合壳在轮廓斜边处存在零面积退化三角形，computeVertexNormals 会除零产生 NaN 法线
    // （表现为布面着色乱成一团）——此处兜底清洗
    const nor=geo.attributes.normal.array;
    let dirty=false;
    for(let i=0;i<nor.length;i+=3){
      if(!Number.isFinite(nor[i])||!Number.isFinite(nor[i+1])||!Number.isFinite(nor[i+2])){
        nor[i]=0; nor[i+1]=0; nor[i+2]=1; dirty=true;
      }
    }
    if(dirty) geo.attributes.normal.needsUpdate=true;
  }
}

const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let hovered=-1, focused=-1;
const pokePrev={x:0,y:0};   // 布料拨动用：上一帧鼠标位置
let dragging=false, dragPrevX=0, dragMoved=0, rackVel=0, rackShift=0;
const RAIL_LIMIT=3.4;
const GAP=0.42;

const nameLabel=document.getElementById("namelabel");
const hint=document.getElementById("hint");
const focusUI=document.getElementById("focusUI");
const loadingEl=document.getElementById("loading");

const canvasEl=renderer.domElement;
canvasEl.addEventListener("pointerdown",(e)=>{
  if(focused>=0) return;
  dragging=true; dragMoved=0; dragPrevX=e.clientX; canvasEl.classList.add("grabbing");
});
addEventListener("pointerup",()=>{
  dragging=false; canvasEl.classList.remove("grabbing");
});
addEventListener("pointermove",(e)=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  if(dragging){
    const dx=(e.clientX-dragPrevX);
    dragPrevX=e.clientX; dragMoved+=Math.abs(dx);
    rackVel+=dx*0.011;
  }
  if(focused>=0){ pokePrev.x=e.clientX; pokePrev.y=e.clientY; return; }
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(garments.map(g=>g.mesh),false);
  // --- 布料拨动：扫过布面的鼠标位移转成局部冲量 ---
  if(hits.length&&!dragging){
    const ddx=e.clientX-pokePrev.x, ddy=e.clientY-pokePrev.y;
    const sp=Math.hypot(ddx,ddy);
    if(sp>2&&sp<120){
      const g=garments.find(x=>x.mesh===hits[0].object);
      if(g&&g.group.visible!==false){
        const lp=g.group.worldToLocal(hits[0].point.clone());
        // 屏幕位移方向 → 相机右/上向量合成世界力 → 逆旋转到衣服局部系
        const f=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0)
          .multiplyScalar(ddx*0.02)
          .add(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1).multiplyScalar(-ddy*0.02));
        f.applyQuaternion(g.group.getWorldQuaternion(new THREE.Quaternion()).invert());
        f.normalize();
        g.poke(lp.x,lp.y,lp.z,f.x,f.y);
      }
    }
  }
  pokePrev.x=e.clientX; pokePrev.y=e.clientY;
  let idx=-1;
  if(hits.length){ for(let i=0;i<N;i++) if(garments[i].mesh===hits[0].object){ idx=i; break; } }
  if(idx!==hovered) setHover(idx);
});

});

function setMatsOpacity(g,op,animate){
  gsap.killTweensOf(g.mats);
  for(const m of g.mats){
    if(op>=1){ m.opacity=1; m.transparent=false; }
    else{
      if(animate) gsap.to(m,{opacity:op,duration:0.4});
      else m.opacity=op;
      m.transparent=true;
    }
  }
}

function setHover(idx){
  hovered=idx;
  garments.forEach((g,i)=>{
    if(focused>=0) return;
    let rot=g.baseRot, sc=g.baseScale, op=1, to=0;
    if(idx>=0){
      if(i===idx){ rot=0; sc=g.baseScale*1.16; }
      else if(Math.abs(i-idx)===1){ to=(i<idx?-1:1)*0.46; }   // 邻件只被推开，不跟着转正
      else op=0.88;
    }
    g.targetOff=to;
    g.iter=(i===idx)?7:4;
    gsap.to(g.group.rotation,{y:rot,duration:0.62,ease:"power2.out"});
    gsap.to(g.group.scale,{x:sc,y:sc,z:sc,duration:0.62,ease:"power2.out"});
    setMatsOpacity(g,op,true);
  });
  const pad=(k)=>String(k+1).padStart(2,"0");
  if(idx>=0){
    nameLabel.querySelector(".idxs").textContent="NO. "+pad(idx);
    nameLabel.querySelector(".nm").textContent=ITEMS[idx].name;
    nameLabel.querySelector(".sub").textContent=ITEMS[idx].sub;
    nameLabel.classList.add("show"); hint.classList.add("hide");
  } else { nameLabel.classList.remove("show"); hint.classList.remove("hide"); }
}

function openFocus(i){
  focused=i; hovered=-1;
  nameLabel.classList.remove("show");   // 关键：隐藏 hover 浮标，否则与聚焦字幕重叠
  garments.forEach((o,j)=>{
    if(j===i) return;
    gsap.to(o.group.position,{z:-5,duration:0.6,ease:"power2.out"});
    setMatsOpacity(o,0.10,true);
  });
  const g=garments[i];
  g.iter=7;
  gsap.to(g.group.rotation,{y:0,duration:0.7,ease:"power3.out"});
  gsap.to(g.group.scale,{x:1.62*g.baseScale,y:1.62*g.baseScale,z:1.62*g.baseScale,duration:0.7,ease:"power3.out"});
  gsap.to(g.group.position,{x:0,y:g.homeY+0.12,z:1.15,duration:0.7,ease:"power3.out"});
  setMatsOpacity(g,1,true);
  focusUI.classList.add("on");
  document.getElementById("focusCap").querySelector(".idxs").textContent="NO. "+String(i+1).padStart(2,"0");
  document.getElementById("focusCap").querySelector(".nm").textContent=g.item.name;
  document.getElementById("focusCap").querySelector(".sub").textContent=g.item.sub;
}

function closeFocus(){
  if(focused<0) return;
  garments.forEach((o,j)=>{
    o.iter=4;
    gsap.to(o.group.position,{x:o.homeX+o.off,y:o.homeY,z:o.homeZ,duration:0.6,ease:"power2.out"});
    gsap.to(o.group.rotation,{y:o.baseRot,duration:0.6,ease:"power2.out"});
    gsap.to(o.group.scale,{x:o.baseScale,y:o.baseScale,z:o.baseScale,duration:0.6,ease:"power2.out"});
    setMatsOpacity(o,1,true);
  });
  focusUI.classList.remove("on");
  focused=-1;
}

function stepFocus(dir){
  if(focused<0) return;
  const ni=(focused+dir+N)%N;
  const prev=garments[focused], next=garments[ni];
  focused=ni;
  gsap.fromTo(prev.group.rotation,{y:0},{y:dir*0.65,duration:0.34,ease:"power2.in",
    onComplete:()=>{
      gsap.to(prev.group.position,{x:prev.homeX+prev.off,y:prev.homeY,z:prev.homeZ,duration:0.42});
      gsap.to(prev.group.scale,{x:prev.baseScale,y:prev.baseScale,z:prev.baseScale,duration:0.42});
      setMatsOpacity(prev,0.10,true);
      gsap.to(prev.group.rotation,{y:prev.baseRot,duration:0.42});
    }});
  next.iter=7;
  gsap.fromTo(next.group.rotation,{y:-dir*0.65},{y:0,duration:0.56,ease:"power3.out"});
  gsap.to(next.group.position,{x:0,y:next.homeY+0.12,z:1.15,duration:0.56,ease:"power3.out"});
  gsap.to(next.group.scale,{x:1.62*next.baseScale,y:1.62*next.baseScale,z:1.62*next.baseScale,duration:0.56,ease:"power3.out"});
  setMatsOpacity(next,1,true);
  document.getElementById("focusCap").querySelector(".idxs").textContent="NO. "+String(ni+1).padStart(2,"0");
  document.getElementById("focusCap").querySelector(".nm").textContent=next.item.name;
  document.getElementById("focusCap").querySelector(".sub").textContent=next.item.sub;
}

document.getElementById("closeBtn").addEventListener("click",closeFocus);

document.getElementById("nextBtn").addEventListener("click",()=>stepFocus(1));
addEventListener("keydown",(e)=>{

/* ══════════════════════════════════════════════════════════════
   10. 主循环：滑轨滑动 + 衣物间推挤 + 布料求解
══════════════════════════════════════════════════════════════*/
const clock=new THREE.Clock();
const perf={frames:0,solver:0,fps:0,_t0:performance.now()};
const FIXED=1/60;                 // 固定物理步长：Verlet 对 dt 敏感，浮动 dt 会积累能量导致抽搐
let accum=0;
let frameNo=0;
function animate(){
  requestAnimationFrame(animate);
  const rdt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;

  // ---- 滑轨：惯性滑动（渲染层，逐帧即可） ----
  rackShift+=rackVel; rackVel*=0.90;
  if(Math.abs(rackVel)<0.0008) rackVel=0;
  rackShift=Math.max(-RAIL_LIMIT,Math.min(RAIL_LIMIT,rackShift));

  // ---- 衣物间的最小间距（推挤手感） ----
  const ops=garments.map(g=>g.off+=(g.targetOff-g.off)*0.14);
  for(let pass=0;pass<2;pass++){
    for(let i=1;i<N;i++){
      const a=garments[i-1], b=garments[i];
      const xa=a.homeX+a.off+rackShift, xb=b.homeX+b.off+rackShift;
      const need=(xb-xa)-(SPACING-GAP*0.5);
      if(need<0){ const push=-need*0.5*(pass?0.5:1); b.off+=push; a.off-=push; }
    }
  }

  // ---- 物理：固定步长子步进 ----
  const t0=performance.now();
  accum+=rdt;
  let steps=0;
  while(accum>=FIXED && steps<2){
    accum-=FIXED; steps++;
    const wind=0.30+0.15*Math.sin(t*0.55);
    for(let i=0;i<N;i++){
      const g=garments[i];
      // 聚焦态：其余 7 件已淡到 0.1 透明度并被推到 z=-5，再全速解算是白烧 CPU
      if(focused>=0&&i!==focused){ g.dirty=false; continue; }
      const hero=(i===hovered||focused===i);
      // 位置与轮子必须逐帧：滑轨惯性是渲染层动作，降频会让滑动看起来卡顿
      if(focused!==i){
        let x=g.homeX+g.off+rackShift;
        x=Math.max(-4.4,Math.min(4.4,x));
        const dx=x-g.prevX; g.prevX=x;
        g.group.position.x=x;
        g.spinWheels(dx);
      }
      // 布料求解 LOD：8 件全速实测 18.9ms/帧，光物理就吃光 60fps 的 16.7ms 预算。
      // 背景件改隔帧 + 迭代 4→3（≈-62% CPU）：它们静止时只是"慢半拍"沉降，肉眼不可辨；
      // 主角（悬停 / 聚焦）仍逐帧 7 次迭代，形变跟随鼠标的精度不受影响。
      if(!hero&&((frameNo+i)&1)===1){ g.dirty=false; continue; }
      const w=(i===hovered)?wind+0.5:wind;
      g.step(FIXED,w,t,hero?g.iter:3);
      g.dirty=true;
    }
  }
  if(steps===2) accum=0;
  frameNo++;
  // 几何同步跟着求解走：没解过的衣服不必重算法线 + 上传顶点
  for(let i=0;i<N;i++){
    const g=garments[i];
    if(g.dirty) g.syncGeometry();
  }
  // 阴影贴图每 3 帧更新一次（布料慢速运动，肉眼不可辨），聚焦时恢复逐帧
  if(frameNo%3===0||focused>=0) renderer.shadowMap.needsUpdate=true;
  perf.solver+=performance.now()-t0;
  perf.frames++;
  if(perf.frames===120){
    const el=(performance.now()-perf._t0)/1000;
    perf.fps=perf.frames/el; perf.solverAvg=perf.solver/perf.frames;
    perf.frames=0; perf.solver=0; perf._t0=performance.now();
  }
  renderer.render(scene,camera);
}
animate();

// 像素级探针
function sampleCanvas(x0=0,y0=0,x1=1,y1=1){
  renderer.render(scene,camera);
  const gl=renderer.getContext();
  const W=gl.drawingBufferWidth,H=gl.drawingBufferHeight;
  const buf=new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,buf);
  const px0=Math.floor(x0*W),px1=Math.ceil(x1*W);
  const py0=Math.floor((1-y1)*H),py1=Math.ceil((1-y0)*H);
  let n=0,hot=0,sum=0,maxL=0,redN=0,redR=0,redG=0,redB=0;
  for(let y=py0;y<py1;y++) for(let x=px0;x<px1;x++){
    const i=(y*W+x)*4;
    const r=buf[i],g=buf[i+1],b=buf[i+2];
    const L=0.2126*r+0.7152*g+0.0722*b;
    n++; sum+=L; if(L>maxL) maxL=L;
    if(r>=250&&g>=250&&b>=250) hot++;
    if(r-g>38&&r-b>38&&r>90){ redN++; redR+=r; redG+=g; redB+=b; }
  }
  return {
    n,hotPct:+(hot/n*100).toFixed(2),
    avgLum:+(sum/n).toFixed(1),maxLum:+maxL.toFixed(0),
    redPixels:redN,
    redMeanRGB:redN?[Math.round(redR/redN),Math.round(redG/redN),Math.round(redB/redN)]:null,
  };
}

loadingEl.style.display="none";
window.__diag={garments,openFocus,closeFocus,setHover,scene,camera,ITEMS,perf,sampleCanvas,renderer};
</script>
